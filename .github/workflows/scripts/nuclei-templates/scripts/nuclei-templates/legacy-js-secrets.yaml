id: legacy-js-secrets

info:
  name: Legacy JS Secrets Exposure
  author: legacy-hunter
  severity: high
  description: Detects secrets in JS files (old endpoints, API keys)
  tags: exposure,js,secrets

requests:
  - method: GET
    path:
      - "{{BaseURL}}/js/app.js"
      - "{{BaseURL}}/js/main.js"
      - "{{BaseURL}}/static/js/app.js"
      - "{{BaseURL}}/assets/js/app.js"
      - "{{BaseURL}}/dist/app.js"
      - "{{BaseURL}}/build/app.js"

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - 'AKIA[0-9A-Z]{16}'
          - 'AIza[0-9A-Za-z_-]{35}'
          - 'sk_live_[0-9a-zA-Z]{24,}'
          - 'ghp_[a-zA-Z0-9]{36}'
          - 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
        part: body

      - type: word
        words:
          - "api_key"
          - "apikey"
          - "secret_key"
          - "access_token"
          - "private_key"
        part: body
