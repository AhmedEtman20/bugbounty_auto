id: legacy-deprecated-headers

info:
  name: Deprecated Headers / Old Server Tech
  author: legacy-hunter
  severity: info
  description: Detects old server versions and deprecated headers
  tags: headers,legacy,misconfig

requests:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - "Server: Apache/2\\.[0-2]"
          - "Server: nginx/1\\.[0-9]"
          - "Server: IIS/[0-9]"
          - "X-Powered-By: PHP/[0-9]\\.[0-9]"
          - "X-AspNet-Version"
          - "X-Generator: Drupal"
        part: header

      - type: word
        words:
          - "X-Powered-By"
          - "X-AspNet-Version"
          - "X-Drupal-Cache"
        part: header
