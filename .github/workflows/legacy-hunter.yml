name: Legacy Hunter v2 — Full Arsenal

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains (space-separated)'
        required: false
        default: ''
      deep:
        description: 'Deep mode'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write          # ← مهم لإنشاء Issues

env:
  PYTHONUNBUFFERED: '1'
  GOPATH: '${{ github.workspace }}/go'
  PATH: '${{ github.workspace }}/go/bin:$PATH'

jobs:
  legacy_hunt:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      # ═══════════════════════════════════════════════════
      #  SETUP
      # ═══════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Go Modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ${{ env.GOPATH }}/bin
          key: ${{ runner.os }}-go-legacy-v4
          restore-keys: ${{ runner.os }}-go-legacy-

      - name: Cache Nuclei Templates
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/nuclei-templates
          key: nuclei-templates-v4

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Go 1.22
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.2.0
        with:
          go-version: '1.22'
          cache: false

      - name: Install System Packages
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            jq curl wget git python3-pip python3-venv \
            dnsutils nmap sqlmap nikto whatweb \
            libpcap-dev build-essential unzip \
            ruby-full libcurl4-openssl-dev libxml2-dev

      - name: Install SecLists
        run: |
          set -e
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/danielmiessler/SecLists.git /tmp/seclists
          cd /tmp/seclists
          git sparse-checkout set \
            Discovery/DNS \
            Discovery/Web-Content \
            Discovery/Web-Content/raft-medium-directories.txt \
            Miscellaneous/dns-resolvers.txt
          sudo mkdir -p /usr/share/seclists
          sudo cp -r /tmp/seclists/* /usr/share/seclists/

      - name: Install GF Patterns
        run: |
          mkdir -p ~/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json ~/.gf/ 2>/dev/null || true

      - name: Install Go Tools
        run: |
          set -e
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.7
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@v1.6.10
          go install -v github.com/projectdiscovery/katana/cmd/katana@v1.1.2
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.5
          go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest    # ← Blind XSS
          go install -v github.com/hahwul/dalfox/v2@v2.9.2
          go install -v github.com/lc/gau/v2/cmd/gau@v2.2.3
          go install -v github.com/tomnomnom/waybackurls@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/tomnomnom/gf@latest
          go install -v github.com/tomnomnom/anew@latest
          go install -v github.com/lc/subjs@latest
          go install -v github.com/003random/getJS@latest
          go install -v github.com/BishopFox/jsluice/cmd/jsluice@latest
          go install -v github.com/xnl-h4ck3r/waymore@latest
          echo "$GOPATH/bin" >> $GITHUB_PATH

      - name: Install Feroxbuster
        run: |
          set -e
          curl -sL https://github.com/epi052/feroxbuster/releases/latest/download/x86_64-linux-feroxbuster.zip -o /tmp/fb.zip
          unzip -o /tmp/fb.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/feroxbuster

      - name: Install Commix
        run: |
          set -e
          sudo git clone --depth 1 https://github.com/commixproject/commix.git /opt/commix
          sudo chmod +x /opt/commix/commix.py

      - name: Install Python Tools
        run: |
          pip3 install -q --upgrade pip
          pip3 install -q uro arjun paramspider robofinder    # ← robofinder

      - name: Setup Nuclei Templates
        run: |
          set -e
          mkdir -p ~/nuclei-templates
          nuclei -update-templates -silent 2>/dev/null || true
          nuclei -update -silent 2>/dev/null || true

      - name: Verify Tools
        run: |
          echo "=== Tool Verification ==="
          FAIL=0
          for t in subfinder dnsx httpx katana nuclei dalfox gau waybackurls assetfinder gf anew subjs getJS jsluice feroxbuster uro arjun interactsh-client sqlmap nikto whatweb nmap jq robofinder; do
            if command -v "$t" >/dev/null 2>&1; then echo "✓ $t"; else echo "✗ $t MISSING"; FAIL=1; fi
          done
          [ -f /opt/commix/commix.py ] && echo "✓ commix" || { echo "✗ commix MISSING"; FAIL=1; }
          [ -d scripts/nuclei-templates ] && echo "✓ custom nuclei templates" || { echo "✗ custom templates MISSING"; FAIL=1; }
          [ "$FAIL" = "0" ] || echo "⚠️ Some tools missing, continuing anyway..."

      - name: Make Script Executable
        run: chmod +x scripts/legacy_scan.sh

      - name: Run Legacy Hunter v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEP_MODE: ${{ github.event.inputs.deep || 'true' }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.domains }}" ]; then
            echo "${{ github.event.inputs.domains }}" | tr ' ' '\n' > /tmp/domains.txt
            ./scripts/legacy_scan.sh /tmp/domains.txt
          else
            ./scripts/legacy_scan.sh domains.txt
          fi

      - name: Upload Full Results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legacy-hunt-full-${{ github.run_number }}
          path: legacy_hunt_*/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Findings Only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: LEGACY-FINDINGS-${{ github.run_number }}
          path: |
            legacy_hunt_*/**/LEGACY_REPORT.md
            legacy_hunt_*/**/recon/*.txt
            legacy_hunt_*/**/vulns/*.txt
            legacy_hunt_*/**/nuclei/*.txt
            legacy_hunt_*/**/blind_xss/*.txt
            legacy_hunt_*/**/robots/*.txt
            legacy_hunt_*/MASTER_LEGACY_REPORT.md
          retention-days: 90
          if-no-files-found: warn
