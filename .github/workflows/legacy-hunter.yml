name: Legacy Hunter v3

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      domains:
        description: 'اكتب الدومينات هنا (بمسافة بينهم)'
        required: false
        default: ''
      deep:
        description: 'وضع عميق'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  legacy_hunt:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl wget git dnsutils sqlmap nikto whatweb nmap ruby-full libcurl4-openssl-dev libxml2-dev
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable

      - name: Install Go Tools
        run: |
          go install -v github.com/owasp-amass/amass/v4/...@master
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest
          go install -v github.com/hahwul/dalfox/v2@latest
          go install -v github.com/lc/gau/v2/cmd/gau@latest
          go install -v github.com/tomnomnom/waybackurls@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/tomnomnom/gf@latest
          go install -v github.com/tomnomnom/anew@latest
          go install -v github.com/lc/subjs@latest
          go install -v github.com/003random/getJS@latest
          go install -v github.com/BishopFox/jsluice/cmd/jsluice@latest
          go install -v github.com/jaeles-project/jaeles@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Commix
        run: |
          sudo git clone --depth 1 https://github.com/commixproject/commix.git /opt/commix
          sudo chmod +x /opt/commix/commix.py

      - name: Install Python Tools
        run: |
          pip3 install -q --upgrade pip
          pip3 install -q uro arjun || true
          pip3 install -q git+https://github.com/devanshbatham/ParamSpider.git || true
          pip3 install -q git+https://github.com/Spix0r/robofinder.git || true

      - name: Setup Nuclei Templates
        run: nuclei -update-templates -silent || true

      - name: Make Script Executable
        run: chmod +x legacy_scan.sh

      - name: Run Legacy Hunter v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEP: ${{ github.event.inputs.deep || 'true' }}
      
        run: |
          set -e
          # لو المستخدم كتب دومين في الـ input، استخدمه
          if [ -n "${{ github.event.inputs.domains }}" ]; then
            echo "${{ github.event.inputs.domains }}" | tr ' ' '\n' > /tmp/domains.txt
          # لو مفيش input، اقرأ من ملف domains.txt في الريبو
          elif [ -f "domains.txt" ]; then
            cp domains.txt /tmp/domains.txt
          # لو مفيش لا ده ولا ده، اطلع خطأ (مش تشتغل على example.com)
          else
            echo "❌ ERROR: No domains provided!"
            echo "Either fill the 'domains' input OR create a domains.txt file in the repo."
            exit 1
          fi
          
          echo "=== Domains to scan ==="
          cat /tmp/domains.txt
          echo "======================="
          
          ./legacy_scan.sh /tmp/domains.txt

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-findings-v3-${{ github.run_number }}
          path: legacy_hunt_*/
          retention-days: 30
          if-no-files-found: warn
