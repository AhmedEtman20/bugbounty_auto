name: Legacy Hunter v3

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      domains:
        description: 'اكتب الدومينات هنا (بمسافة بينهم)'
        required: true
        default: 'example.com'
      deep:
        description: 'وضع عميق (Amass brute force)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  legacy_hunt:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl wget git dnsutils sqlmap nikto whatweb nmap ruby-full libcurl4-openssl-dev libxml2-dev
          sudo apt-get install -y -qq --no-install-recommends amass

      - name: Install Go Tools (Subfinder, Amass alternative, Nuclei, etc.)
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/lc/subjs@latest
          go install github.com/003random/getJS@latest
          go install github.com/BishopFox/jsluice/cmd/jsluice@latest
          go install github.com/xnl-h4ck3r/waymore@latest
          go install github.com/jaeles-project/jaeles@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Commix
        run: |
          sudo git clone --depth 1 https://github.com/commixproject/commix.git /opt/commix
          sudo chmod +x /opt/commix/commix.py

      - name: Install Python Tools
        run: pip3 install -q uro arjun paramspider robofinder

      - name: Install SecLists
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/danielmiessler/SecLists.git /tmp/seclists
          cd /tmp/seclists && git sparse-checkout set Discovery/DNS Discovery/Web-Content Miscellaneous/dns-resolvers.txt
          sudo mkdir -p /usr/share/seclists && sudo cp -r /tmp/seclists/* /usr/share/seclists/

      - name: Setup Nuclei Templates
        run: nuclei -update-templates -silent || true

      - name: Make Script Executable
        run: chmod +x legacy_scan.sh

      - name: Run Legacy Hunter v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEP: ${{ github.event.inputs.deep || 'true' }}
        run: |
          echo "${{ github.event.inputs.domains }}" | tr ' ' '\n' > domains.txt
          ./legacy_scan.sh domains.txt

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-findings-v3-${{ github.run_number }}
          path: legacy_hunt_*/
          retention-days: 30
